apiVersion: v1
kind: Service
metadata:
  name: listener-filter-externalauth-reference-grant-backend
  namespace: gateway-conformance-web-backend
spec:
  selector:
    app: web-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-listener-filter-externalauth-reference-grant
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef:
                name: listener-filter-externalauth-reference-grant-backend
                namespace: gateway-conformance-web-backend
                port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: reference-grant-listener-filter-externalauth
  namespace: gateway-conformance-web-backend
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: gateway-conformance-infra
  to:
    - group: ""
      kind: Service
      name: listener-filter-externalauth-reference-grant-backend
