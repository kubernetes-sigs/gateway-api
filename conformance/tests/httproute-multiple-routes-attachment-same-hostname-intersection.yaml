apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-httproute-exact-hostname-x
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
  - name: listener-exact-hostname-80
    protocol: HTTP
    port: 80
    hostname: abc.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
  - name: listener-exact-hostname-8000
    protocol: HTTP
    port: 8000
    hostname: abc.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
  - name: listener-exact-hostname-8080
    protocol: HTTP
    port: 8080
    hostname: abc.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-httproute-wc-hostname-x
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
  - name: listener-wc-hostname-80
    protocol: HTTP
    port: 80
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
  - name: listener-wc-hostname-8000
    protocol: HTTP
    port: 8000
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
  - name: listener-wc-hostname-8080
    protocol: HTTP
    port: 8080
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-wc-hostname-x-older
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gw-httproute-exact-hostname-x
    namespace: gateway-conformance-infra
    sectionName: listener-exact-hostname-80
  hostnames:
  - "*.example.com"
  rules:
  - backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-wc-hostname-x-path-older
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gw-httproute-exact-hostname-x
    namespace: gateway-conformance-infra
    sectionName: listener-exact-hostname-8000
  hostnames:
  - "*.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /prefix/longer
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-wc-hostname-x-path-header-older
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gw-httproute-exact-hostname-x
    namespace: gateway-conformance-infra
    sectionName: listener-exact-hostname-8080
  hostnames:
  - "*.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /prefix/longer
      headers:
      - type: Exact
        name: Header-B
        value: B
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
