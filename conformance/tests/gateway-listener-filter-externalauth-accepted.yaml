apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-listener-filter-externalauth-accepted
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef:
                name: infra-backend-v1
                port: 8080
