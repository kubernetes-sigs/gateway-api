apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-auth-grpc
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - filters:
    - type: ExternalAuth
      externalAuth:
        protocol: GRPC
        backendRef:
          name: external-auth-grpc
          port: 9001
        grpc:
          allowedHeaders: ~
    backendRefs:
    - name: infra-backend-v1
      port: 8080
