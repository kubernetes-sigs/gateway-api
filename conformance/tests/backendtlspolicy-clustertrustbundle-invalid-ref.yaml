apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backendtlspolicy-clustertrustbundle-invalid-ref
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
      namespace: gateway-conformance-infra
  hostnames:
    - abc.example.com
  rules:
    - backendRefs:
        - name: backendtlspolicy-clustertrustbundle-invalid-ref-test
          port: 443
      matches:
        - path:
            type: Exact
            value: /backendtlspolicy-clustertrustbundle-invalid-ref
---
apiVersion: v1
kind: Service
metadata:
  name: backendtlspolicy-clustertrustbundle-invalid-ref-test
  namespace: gateway-conformance-infra
spec:
  selector:
    app: tls-backend
  ports:
    - name: "https"
      protocol: TCP
      appProtocol: HTTPS
      port: 443
      targetPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster-trust-bundle-nonexistent
  namespace: gateway-conformance-infra
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: "backendtlspolicy-clustertrustbundle-invalid-ref-test"
  validation:
    caCertificateRefs:
      - group: certificates.k8s.io
        kind: ClusterTrustBundle
        # This ClusterTrustBundle is intentionally never created by the test
        # suite, so the reference does not resolve.
        name: "nonexistent-cluster-trust-bundle"
    hostname: "abc.example.com"
