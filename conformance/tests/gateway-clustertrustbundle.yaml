apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-trust-bundle
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
          - group: certificates.k8s.io
            kind: ClusterTrustBundle
            # This ClusterTrustBundle is generated dynamically by the test suite.
            # It contains the CA certificate used to sign the client certificate.
            name: "gateway-cluster-trust-bundle"
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      certificateRefs:
      - group: ""
        kind: Secret
        name: tls-validity-checks-certificate
        namespace: gateway-conformance-infra
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cluster-trust-bundle-test
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: cluster-trust-bundle
    namespace: gateway-conformance-infra
  hostnames:
  - example.org
  rules:
  - backendRefs:
    - name: infra-backend-v1
      port: 8080
