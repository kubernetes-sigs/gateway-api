apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-listener-filter-externalauth-invalid-ref
  namespace: gateway-conformance-infra
  annotations:
    gateway-api/skip-this-for-readiness: "true"
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http-nonexistent-backend
      port: 80
      protocol: HTTP
      hostname: nonexistent.example.com
      allowedRoutes:
        namespaces:
          from: Same
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef:
                name: nonexistent-auth-backend
                port: 8080
    - name: http-missing-reference-grant
      port: 80
      protocol: HTTP
      hostname: missing-reference-grant.example.com
      allowedRoutes:
        namespaces:
          from: Same
      filters:
        requests:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef:
                name: web-backend
                namespace: gateway-conformance-web-backend
                port: 8080
