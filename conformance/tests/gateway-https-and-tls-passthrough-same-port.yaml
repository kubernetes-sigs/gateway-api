apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-https-tls-passthrough-same-port
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
  - name: https-terminate
    port: 8884
    protocol: HTTPS
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: HTTPRoute
    tls:
      mode: Terminate
      # Covers other.example.com, the only name this listener is asked to
      # serve. It carries no wildcard SAN, and widening the shared secret
      # would break the BackendTLSPolicy tests that rely on names under
      # example.com not matching.
      certificateRefs:
      - name: tls-checks-certificate
  # Overlaps with the wildcard above without being equal to it. Carrying both,
  # and picking between them by the more specific hostname, is what the
  # feature covers.
  - name: tls-passthrough
    port: 8884
    protocol: TLS
    hostname: abc.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-conformance-https-terminate
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gateway-https-tls-passthrough-same-port
    namespace: gateway-conformance-infra
    sectionName: https-terminate
  rules:
  - backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: gateway-conformance-tls-passthrough
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: gateway-https-tls-passthrough-same-port
    namespace: gateway-conformance-infra
    sectionName: tls-passthrough
  hostnames:
  - abc.example.com
  rules:
  - backendRefs:
    - name: tcp-backend
      port: 8443
