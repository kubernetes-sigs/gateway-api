apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: backendtlspolicy-clustertrustbundle-grpcroute
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
    namespace: gateway-conformance-infra
  hostnames:
  - other.example.com
  rules:
  - matches:
    - method:
        service: gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
        method: Echo
    backendRefs:
    - group: ""
      kind: Service
      name: clustertrustbundle-grpc-test
      port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: clustertrustbundle-grpc-test
  namespace: gateway-conformance-infra
spec:
  selector:
    app: grpc-infra-backend-v1
  ports:
  - name: "btls"
    protocol: TCP
    port: 443
    targetPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster-trust-bundle-grpcroute
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: clustertrustbundle-grpc-test
    sectionName: "btls"
  validation:
    caCertificateRefs:
    - group: certificates.k8s.io
      kind: ClusterTrustBundle
      # This ClusterTrustBundle is generated dynamically by the test suite and
      # contains the CA certificate used to sign the gRPC backend serving certificate.
      name: "backendtlspolicy-cluster-trust-bundle-grpcroute"
    hostname: "abc.example.com"
