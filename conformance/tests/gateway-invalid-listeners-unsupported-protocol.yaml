apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-only-unsupported-protocols
  namespace: gateway-conformance-infra
  annotations:
    gateway-api/skip-this-for-readiness: "true"
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: invalid
      port: 1111
      protocol: INVALID
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-supported-and-unsupported-protocols
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: invalid
      port: 1111
      protocol: INVALID
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-supported-and-unsupported-protocols-control
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: gateway-supported-and-unsupported-protocols
      sectionName: http
  hostnames:
    - unsupported-protocol.example.com
  rules:
    - backendRefs:
        - name: infra-backend-v1
          port: 8080
