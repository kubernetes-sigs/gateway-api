apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backendtlspolicy-clustertrustbundle-test
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
    namespace: gateway-conformance-infra
  hostnames:
  - abc.example.com
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: backendtlspolicy-clustertrustbundle-valid-test
      port: 443
    matches:
    - path:
        type: Exact
        value: /backendtlspolicy-clustertrustbundle-valid
  - backendRefs:
    - group: ""
      kind: Service
      name: backendtlspolicy-clustertrustbundle-mismatch-test
      port: 443
    matches:
    - path:
        type: Exact
        value: /backendtlspolicy-clustertrustbundle-mismatch
---
apiVersion: v1
kind: Service
metadata:
  name: backendtlspolicy-clustertrustbundle-valid-test
  namespace: gateway-conformance-infra
spec:
  selector:
    app: tls-backend
  ports:
  - name: "btls"
    protocol: TCP
    port: 443
    targetPort: 8443
---
apiVersion: v1
kind: Service
metadata:
  name: backendtlspolicy-clustertrustbundle-mismatch-test
  namespace: gateway-conformance-infra
spec:
  selector:
    app: tls-backend
  ports:
  - name: "btls"
    protocol: TCP
    port: 443
    targetPort: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster-trust-bundle-valid
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backendtlspolicy-clustertrustbundle-valid-test
    sectionName: "btls"
  validation:
    caCertificateRefs:
    - group: certificates.k8s.io
      kind: ClusterTrustBundle
      # This ClusterTrustBundle is generated dynamically by the test suite and
      # contains the CA certificate used to sign the tls-backend serving certificate.
      name: "backendtlspolicy-cluster-trust-bundle"
    hostname: "abc.example.com"
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: cluster-trust-bundle-mismatch
  namespace: gateway-conformance-infra
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: backendtlspolicy-clustertrustbundle-mismatch-test
    sectionName: "btls"
  validation:
    caCertificateRefs:
    - group: certificates.k8s.io
      kind: ClusterTrustBundle
      # This ClusterTrustBundle is generated dynamically by the test suite and
      # contains the CA certificate used to sign the tls-backend serving certificate.
      name: "backendtlspolicy-cluster-trust-bundle"
    hostname: "mismatch.example.com"
