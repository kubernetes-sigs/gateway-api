apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-listener-filter-extensionref-invalid-ref
  namespace: gateway-conformance-infra
  annotations:
    gateway-api/skip-this-for-readiness: "true"
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
      filters:
        requests:
          - type: ExtensionRef
            extensionRef:
              group: example.com
              kind: NonExistentListenerFilter
              name: nonexistent
