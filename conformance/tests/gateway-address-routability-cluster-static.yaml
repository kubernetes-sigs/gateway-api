apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-address-routability-cluster-static-partial
  namespace: gateway-conformance-infra
  annotations:
    gateway-api/skip-this-for-readiness: "true"
spec:
  gatewayClassName: "{GATEWAY_CLASS_NAME}"
  addresses:
  - type: IPAddress
    value: "PLACEHOLDER_UNUSABLE_CLUSTER_ADDRS"
    routability: Cluster
  - type: IPAddress
    routability: ""
  listeners:
  - name: http
    port: 80
    protocol: HTTP
---
