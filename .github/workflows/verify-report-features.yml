name: Verify conformance report features

on:
  pull_request:
    paths:
      - 'conformance/reports/**'
      - 'conformance/release-features/**'
      - 'tools/reportfeatures/**'
      - 'pkg/features/**'

permissions:
  contents: read

jobs:
  verify-report-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify report features
        run: go run ./tools/reportfeatures
